openapi: 3.1.0
info:
  title: GameHub API
  version: 1.0.0
  description: >
    Per-user TikFinity gift hooks, game bindings, settings, and live SSE.
    Session cookie (Auth.js / Google) protects authenticated routes.
    Hook ingest is authenticated by the path token only.
servers:
  - url: http://localhost:3000
    description: Local workshop
paths:
  /api/v1/hooks/{token}/events:
    post:
      operationId: ingestHookEvent
      summary: Ingest a TikFinity gift event for the user who owns this token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TikFinityGiftBody"
      responses:
        "202":
          description: Accepted (action published) or ignored with reason
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HookAccepted"
                  - $ref: "#/components/schemas/HookIgnored"
        "401":
          description: Unknown hook token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account inactive or access period ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/hooks/me:
    get:
      operationId: getMyHook
      summary: Return the current user's hook URL and token
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Hook details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookInfo"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: rotateMyHook
      summary: Rotate the hook token (invalidates the previous URL)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: New hook details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookInfo"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/games/{slug}/bindings:
    get:
      operationId: getBindings
      summary: Gift name to action map for a game
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putBindings
      summary: Replace gift bindings for a game
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingsBody"
      responses:
        "200":
          description: Saved bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/games/{slug}/settings:
    get:
      operationId: getSettings
      summary: Game settings for the signed-in user
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putSettings
      summary: Replace game settings
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSettings"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/games/{slug}/live:
    get:
      operationId: liveStream
      summary: Server-sent events stream of gift actions for the signed-in user
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/games/{slug}/test:
    post:
      operationId: testGift
      summary: Publish a gift action onto the live stream without TikFinity
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [giftName]
              properties:
                giftName:
                  type: string
                repeatCount:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
      responses:
        "202":
          description: Published or ignored
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HookAccepted"
                  - $ref: "#/components/schemas/HookIgnored"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices/codes:
    post:
      operationId: createDeviceCode
      summary: Mint a one-time code that a desktop game exchanges for a device token
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
      responses:
        "200":
          description: Pair code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account inactive or access period ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices/link:
    post:
      operationId: linkDevice
      summary: Exchange a pair code for a device token. The raw token is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, slug, deviceName]
              properties:
                code:
                  type: string
                slug:
                  type: string
                deviceName:
                  type: string
                  maxLength: 40
      responses:
        "200":
          description: Device token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLink"
        "401":
          description: Pair code invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account inactive or access period ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices:
    get:
      operationId: listDevices
      summary: Linked desktop clients for one game
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Revoke a desktop client. Later polls with its token fail.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked, id]
                properties:
                  revoked:
                    type: boolean
                  id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices/live:
    get:
      operationId: pollDeviceLive
      summary: Long-poll the next gift actions for a linked desktop game
      security:
        - deviceToken: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Events queued during this hold, or an empty list after about 25s
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePoll"
        "401":
          description: Missing or revoked device token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Lease ended, account inactive, or token slug mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices/state:
    post:
      operationId: postDeviceState
      summary: Heartbeat and optional status from the desktop game. Not a gift.
      security:
        - deviceToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceState"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [ok, lastSeenAt]
                properties:
                  ok:
                    type: boolean
                  lastSeenAt:
                    type: string
                    format: date-time
        "401":
          description: Missing or revoked device token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Lease ended or account inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/devices/settings:
    get:
      operationId: getDeviceSettings
      summary: Game settings for the linked desktop client
      security:
        - deviceToken: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Settings saved for this user and game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          description: Missing or revoked device token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Lease ended or account inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putDeviceSettings
      summary: Save pause-menu settings from the desktop game
      security:
        - deviceToken: []
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSettings"
      responses:
        "200":
          description: Stored settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          description: Missing or revoked device token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
    deviceToken:
      type: http
      scheme: bearer
  parameters:
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        example: dont-touch-the-water
  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown game slug
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    TikFinityGiftBody:
      type: object
      properties:
        event:
          type: string
          description: Optional TikFinity envelope event name (gift)
        data:
          $ref: "#/components/schemas/GiftData"
        giftName:
          type: string
        repeatCount:
          type: integer
        giftType:
          type: integer
        repeatEnd:
          type: boolean
        coins:
          type: integer
    GiftData:
      type: object
      properties:
        giftName:
          type: string
        repeatCount:
          type: integer
        giftType:
          type: integer
        repeatEnd:
          type: boolean
        coins:
          type: integer
        giftId:
          type: string
    HookAccepted:
      type: object
      required: [giftName, action, repeatCount]
      properties:
        giftName:
          type: string
        action:
          type: string
        repeatCount:
          type: integer
    HookIgnored:
      type: object
      required: [ignored, reason]
      properties:
        ignored:
          type: boolean
          const: true
        reason:
          type: string
          enum: [streak, unmapped, duplicate]
    HookInfo:
      type: object
      required: [token, url]
      properties:
        token:
          type: string
        url:
          type: string
          format: uri
    BindingsBody:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: object
          additionalProperties:
            type: string
    BindingsResponse:
      type: object
      required: [slug, bindings]
      properties:
        slug:
          type: string
        bindings:
          type: object
          additionalProperties:
            type: string
    GameSettings:
      description: >
        Shape depends on the game slug. Don’t Touch the Lava uses LavaSettings.
        Don’t Touch the Grass and One More Lawn use GrassSettings.
        Every other slug uses WaterSettings.
      oneOf:
        - $ref: "#/components/schemas/WaterSettings"
        - $ref: "#/components/schemas/LavaSettings"
        - $ref: "#/components/schemas/GrassSettings"
    WaterSettings:
      type: object
      required: [monster, diff, fov, push, custom]
      properties:
        monster:
          type: string
          enum: [stalker, crawler, beast, shadow]
        diff:
          type: integer
          minimum: 0
          maximum: 3
        fov:
          type: number
          minimum: 60
          maximum: 120
        push:
          type: number
          minimum: 6
          maximum: 24
        custom:
          type: integer
    LavaSettings:
      type: object
      required: [lives, levels, platforms]
      properties:
        lives:
          type: integer
          minimum: 1
          maximum: 20
          description: Hits before the run ends. Default 3.
        levels:
          type: integer
          minimum: 1
          maximum: 20
          description: Levels to finish to beat the game. Default 5.
        platforms:
          type: integer
          minimum: 4
          maximum: 40
          description: Platforms in each generated level, including start and goal. Default 8.
    GrassSettings:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 1
          description: Placeholder until the game has settings. Always 1.
    SettingsResponse:
      type: object
      required: [slug, settings]
      properties:
        slug:
          type: string
        settings:
          $ref: "#/components/schemas/GameSettings"
    PairCode:
      type: object
      required: [code, slug, expiresAt]
      properties:
        code:
          type: string
        slug:
          type: string
        expiresAt:
          type: string
          format: date-time
    DeviceLink:
      type: object
      required: [token, deviceId, slug]
      properties:
        token:
          type: string
          description: Returned once. Store it in the desktop app.
        deviceId:
          type: string
        slug:
          type: string
    Device:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        lastStatus:
          type: string
          nullable: true
        lastScore:
          type: number
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    LivePoll:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/LiveAction"
    LiveAction:
      type: object
      required: [type, slug, giftName, action, repeatCount]
      properties:
        type:
          type: string
          const: action
        slug:
          type: string
        giftName:
          type: string
        action:
          type: string
        repeatCount:
          type: integer
        label:
          type: string
    DeviceState:
      type: object
      properties:
        slug:
          type: string
        status:
          type: string
          enum: [ready, paused]
        score:
          type: number
